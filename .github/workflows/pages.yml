name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  # Piyasa verisini tazelemek için. Ayrı bir iş akışı KULLANILMIYOR: GitHub,
  # bot token'ıyla atılan commit'lerin başka bir akışı tetiklemesine izin
  # vermiyor, dolayısıyla veri güncellenip site yeniden yayınlanmıyordu.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Aynı anda tek yayın çalışsın; sıradaki tetikler beklesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Piyasa verisini tazele
        # Betik yalnızca geçerli veri aldığında dosyayı değiştirir; alamazsa
        # son iyi bilinen değerler korunur ve derleme yine de sürer.
        run: node scripts/piyasa-guncelle.mjs

      - name: Piyasa verisi değiştiyse kaydet
        # Commit yalnızca kalıcılık içindir; bu çalışma zaten güncel dosyayla derler.
        run: |
          if git diff --quiet -- content/piyasa.json; then
            echo "Piyasa verisi değişmedi."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/piyasa.json
          git commit -m 'chore: piyasa verisi güncellendi'
          git push

      - name: Denetimler
        run: |
          npm run typecheck
          npm run lint

      - uses: actions/configure-pages@v5
        id: pages

      - name: Derle
        env:
          # Proje sitesi alt yolda yayınlandığı için ön ek gerekir.
          # Kendi alan adınızı bağlarsanız bu iki satırı güncelleyin.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: npm run build

      - name: Jekyll işlemesini kapat
        # Alt çizgiyle başlayan Next.js klasörleri (_next) aksi halde yok sayılır.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
