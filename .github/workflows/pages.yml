name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  # Piyasa verisini tazelemek için. Ayrı bir iş akışı KULLANILMIYOR: GitHub,
  # bot token'ıyla atılan commit'lerin başka bir akışı tetiklemesine izin
  # vermiyor, dolayısıyla veri güncellenip site yeniden yayınlanmıyordu.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın çalışsın; sıradaki tetikler beklesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      # Son iyi bilinen piyasa verisi commit yerine önbellekte taşınır.
      # Commit atmak depoya gürültü eklerdi ve her seferinde GitHub'ın eski
      # Jekyll derleyicisini tetikleyerek yayınlanan siteyi ezme riski yaratırdı.
      - name: Önceki piyasa verisini geri yükle
        uses: actions/cache/restore@v4
        with:
          path: content/piyasa.json
          key: piyasa-${{ github.run_id }}
          restore-keys: piyasa-

      - name: Piyasa verisini tazele
        # Betik yalnızca geçerli veri aldığında dosyayı değiştirir; alamazsa
        # son iyi bilinen değerler korunur ve derleme yine de sürer.
        run: node scripts/piyasa-guncelle.mjs

      - name: Piyasa verisini sakla
        uses: actions/cache/save@v4
        with:
          path: content/piyasa.json
          key: piyasa-${{ github.run_id }}

      - name: Denetimler
        run: |
          npm run typecheck
          npm run lint

      - uses: actions/configure-pages@v5
        id: pages

      - name: Derle
        env:
          # Proje sitesi alt yolda yayınlandığı için ön ek gerekir.
          # Kendi alan adınızı bağlarsanız bu iki satırı güncelleyin.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: npm run build

      - name: Jekyll işlemesini kapat
        # Alt çizgiyle başlayan Next.js klasörleri (_next) aksi halde yok sayılır.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
